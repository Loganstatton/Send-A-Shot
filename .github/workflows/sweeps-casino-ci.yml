name: sweeps-casino CI

on:
  push:
    paths:
      - 'apps/sweeps-casino/**'
      - '.github/workflows/sweeps-casino-ci.yml'
  pull_request:
    paths:
      - 'apps/sweeps-casino/**'
      - '.github/workflows/sweeps-casino-ci.yml'

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/sweeps-casino/backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sweeps
          POSTGRES_PASSWORD: sweeps
          POSTGRES_DB: sweeps_casino
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sweeps -d sweeps_casino"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://sweeps:sweeps@localhost:5432/sweeps_casino?schema=public
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      NODE_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/sweeps-casino/backend/package-lock.json
      - run: npm install
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/sweeps-casino/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/sweeps-casino/frontend/package-lock.json
      - run: npm install
      - run: npm run lint
      - run: npm run build
