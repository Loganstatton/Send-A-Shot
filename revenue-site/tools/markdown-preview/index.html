<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markdown Previewer — Free Online Tool | QuickTools</title>
<meta name="description" content="Write Markdown and see a live HTML preview instantly, right in your browser. Free, no sign-up.">
<link rel="canonical" href="https://quicktools-hub-delta.vercel.app/tools/markdown-preview/">
<link rel="stylesheet" href="../../assets/style.css">
<style>
  .preview{background:var(--card); border:1px solid var(--border); border-radius:10px; padding:20px; min-height:340px}
  .preview h1,.preview h2,.preview h3{margin-top:0}
  .preview pre{background:var(--code-bg); padding:10px; border-radius:6px}
  .preview code{background:var(--code-bg); padding:1px 5px; border-radius:4px}
  .split{display:grid; grid-template-columns:1fr 1fr; gap:16px}
  @media (max-width:720px){ .split{grid-template-columns:1fr} }
</style>
</head>
<body>
<header class="site-header">
  <a class="brand" href="/" style="text-decoration:none">Quick<span>Tools</span></a>
  <nav class="site-nav"><a href="/about.html">About</a><a href="/privacy.html">Privacy</a></nav>
</header>
<main class="wide">
  <div class="breadcrumb"><a href="/">Home</a> / Markdown Previewer</div>
  <h1>Markdown Previewer</h1>
  <p class="subtitle">Type Markdown on the left, see the rendered HTML on the right.</p>

  <div class="split">
    <div class="card">
      <label for="input">Markdown</label>
      <textarea id="input" rows="18" oninput="render()"># Hello world

Type **Markdown** on the left.

- item one
- item two

[a link](https://example.com)</textarea>
    </div>
    <div>
      <label>Preview</label>
      <div class="preview" id="preview"></div>
    </div>
  </div>

  <div class="ad-slot">Ad space</div>
</main>
<footer><p>&copy; <span id="year"></span> QuickTools &middot; <a href="/about.html">About</a> &middot; <a href="/privacy.html">Privacy</a> &middot; <a href="/terms.html">Terms</a></p></footer>
<script src="../../assets/site.js"></script>
<script>
function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function mdToHtml(md){
  var lines = md.split('\n');
  var html = [];
  var inList = false, inCode = false, codeBuf = [];
  lines.forEach(function(line){
    if (/^```/.test(line)) {
      if (!inCode) { inCode = true; codeBuf = []; }
      else { inCode = false; html.push('<pre><code>' + escapeHtml(codeBuf.join('\n')) + '</code></pre>'); }
      return;
    }
    if (inCode) { codeBuf.push(line); return; }

    var h = line.match(/^(#{1,6})\s+(.*)/);
    if (h) {
      if (inList) { html.push('</ul>'); inList = false; }
      html.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
      return;
    }
    if (/^\s*[-*]\s+/.test(line)) {
      if (!inList) { html.push('<ul>'); inList = true; }
      html.push('<li>' + inline(line.replace(/^\s*[-*]\s+/, '')) + '</li>');
      return;
    }
    if (inList) { html.push('</ul>'); inList = false; }
    if (line.trim() === '') { html.push(''); return; }
    html.push('<p>' + inline(line) + '</p>');
  });
  if (inList) html.push('</ul>');
  return html.join('\n');
}
function inline(text){
  text = escapeHtml(text);
  text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  text = text.replace(/\*(.+?)\*/g, '<em>$1</em>');
  text = text.replace(/`(.+?)`/g, '<code>$1</code>');
  text = text.replace(/\[(.+?)\]\((.+?)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  return text;
}
function render(){
  document.getElementById('preview').innerHTML = mdToHtml(document.getElementById('input').value);
}
render();
</script>
</body>
</html>
