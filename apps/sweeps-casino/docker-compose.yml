name: sweeps-casino

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sweeps
      POSTGRES_PASSWORD: sweeps
      POSTGRES_DB: sweeps_casino
    ports:
      - '5432:5432'
    volumes:
      - sweeps_casino_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sweeps -d sweeps_casino']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://sweeps:sweeps@postgres:5432/sweeps_casino?schema=public
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost:3100
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    env_file:
      - ./frontend/.env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    ports:
      - '3100:3100'
    depends_on:
      - backend

volumes:
  sweeps_casino_postgres:
